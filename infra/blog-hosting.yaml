AWSTemplateFormatVersion: '2010-09-09'
Description: >
  HeatRelief blog: static site in S3, served directly via S3 website hosting or
  over HTTPS by CloudFront.

Parameters:
  EnableCloudFront:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable CloudFront CDN. Leave false if AWS account is not yet verified for CloudFront.

Conditions:
  UseCloudFront: !Equals [!Ref EnableCloudFront, 'true']
  UseS3Website: !Equals [!Ref EnableCloudFront, 'false']

Resources:
  BlogBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: !If [UseCloudFront, true, false]
        BlockPublicPolicy: !If [UseCloudFront, true, false]
        IgnorePublicAcls: !If [UseCloudFront, true, false]
        RestrictPublicBuckets: !If [UseCloudFront, true, false]
      WebsiteConfiguration: !If
        - UseS3Website
        - IndexDocument: index.html
          ErrorDocument: index.html
        - !Ref 'AWS::NoValue'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  BlogOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BlogDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HeatRelief blog
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200   # includes edge locations in India
        Origins:
          - Id: blog-s3
            DomainName: !GetAtt BlogBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt BlogOAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: blog-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  BlogCloudFrontBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref BlogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${BlogBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${BlogDistribution}'

  BlogWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseS3Website
    Properties:
      Bucket: !Ref BlogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${BlogBucket.Arn}/*'

Outputs:
  BlogUrl:
    Value: !If
      - UseCloudFront
      - !Sub 'https://${BlogDistribution.DomainName}'
      - !Sub 'http://${BlogBucket}.s3-website-${AWS::Region}.amazonaws.com'
  BlogBucketName:
    Value: !Ref BlogBucket
  BlogDistributionId:
    Value: !If [UseCloudFront, !Ref BlogDistribution, 'None']
